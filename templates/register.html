<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl shadow-xl border border-slate-800">

        <h1 class="text-3xl font-bold text-center text-white mb-6">
            Create <span class="text-sky-400">Account</span>
        </h1>

        <form method="POST" class="space-y-5">

            <input type="text" name="username" placeholder="Username" required
                class="w-full px-4 py-3 rounded-lg bg-slate-800 text-white placeholder-gray-400 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">

            <input type="password" name="password" placeholder="Password" required
                class="w-full px-4 py-3 rounded-lg bg-slate-800 text-white placeholder-gray-400 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500">

            <!-- <button type="submit"
                class="w-full bg-sky-500 hover:bg-sky-600 text-white font-semibold py-3 rounded-lg transition duration-200">
                Register
            </button> -->

        </form>

        <p class="text-center text-gray-400 mt-5">
            Already have an account?
            <a href="/login" class="text-sky-400 hover:underline">Login</a>
        </p>

    </div>

</body>

</html>
